name: Resource Run QA
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax checks
        run: |
          node --check trg-v12-data.js
          node --check trg-v12-services.js
          node --check trg-v12-engine.js
          node --check trg-v13-experience.js
          node --check trg-v13-audio.js
          node --check trg-v13-ui-fixed.js
          node --check trg-sw.js
      - name: Production asset guard
        run: |
          grep -q 'trg-v13.css?v=13.0.0-rc1' index.html
          grep -q 'trg-v13-ui-fixed.js?v=13.0.0-rc1.1' index.html
          ! grep -q 'trg-v12-ui.js' index.html
      - name: DOM contract
        run: node tests/dom-contract.mjs
      - name: Engine smoke tests
        run: node tests/smoke.mjs
      - name: Accessibility guardrails
        run: |
          grep -q 'min-height:44px' trg-v13.css
          grep -q 'prefers-reduced-motion' trg-v13.css
          grep -q ':focus-visible' trg-v13.css
