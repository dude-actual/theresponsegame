name: Resource Run QA
on:
  push:
    branches: [main, v17-rebuild]
  pull_request:
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Production and historical JavaScript syntax
        run: |
          for file in v17-engine.js v17-ui.js trg-sw.js trg-v12-data.js trg-v12-services.js trg-v12-engine.js trg-v13-experience.js trg-v13-audio.js trg-v14-ui.js trg-v15-impact.js trg-v16-planning.js; do
            node --check "$file"
          done
      - name: Simulation, persistence, production assets and historical contracts
        run: |
          for test in tests/*.mjs; do
            node "$test"
          done
      - name: Whitespace and patch integrity
        run: git diff --check
