name: Readiness platform verification
on:
  push:
    branches: [main, readiness-platform-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify syntax, scenario engine and database
        run: |
          node --check app.js
          node --check engine.js
          node --check catalog.js
          node --check trg-sw.js
          node tests/test_engine.cjs
          python tests/test_database.py
          python tests/test_http.py
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test hosted browser and native storage
        shell: bash
        run: |
          python backend/server.py --port 8765 --db "$RUNNER_TEMP/trg-demo.sqlite3" > "$RUNNER_TEMP/trg-server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          python - <<'PY'
          import time, urllib.request
          for i in range(50):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=1).read()
                  break
              except Exception:
                  time.sleep(.2)
          else:
              raise SystemExit('Local server did not become ready')
          PY
          TRG_BASE_URL=http://127.0.0.1:8765 python tests/test_browser.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: readiness-qa-${{ github.sha }}
          path: |
            qa/*.json
            qa/*.png
          retention-days: 14
