  <g fill="#93a38b" opacity=".1"><ellipse cx="810" cy="277" rx="32" ry="15" transform="rotate(31 810 277)"/><ellipse cx="947" cy="457" rx="42" ry="17" transform="rotate(43 947 457)"/><ellipse cx="853" cy="362" rx="36" ry="13" transform="rotate(28 853 362)"/></g>

  <!-- Industrial quay and secured terminal apron. -->
