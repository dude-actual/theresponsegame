    <path id="westShore" d="M-20-20H270L278 12 249 47 262 76 233 105 243 119 221 142 226 158 211 181 223 204 195 236 201 260 178 294 188 321 158 353 168 380 139 410 145 436 107 468 110 483 73 509 78 532 41 548 44 576 4 595H-20Z"/>
