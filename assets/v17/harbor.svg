<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" fill="none">
  <title>Blackwater Reach — fictional operational chart</title>
  <desc>An authored estuary chart with an industrial port to the southwest, a deep shipping channel, and a tidal marsh to the northeast. Decorative cartography only; resource positions and incident conditions belong to the interactive overlay.</desc>
  <defs>
    <linearGradient id="sea" x1="920" y1="0" x2="360" y2="840" gradientUnits="userSpaceOnUse"><stop stop-color="#264c4d"/><stop offset=".5" stop-color="#17363b"/><stop offset="1" stop-color="#0c232e"/></linearGradient>
    <linearGradient id="land" x1="1100" y1="0" x2="830" y2="640" gradientUnits="userSpaceOnUse"><stop stop-color="#44534a"/><stop offset=".5" stop-color="#34473e"/><stop offset="1" stop-color="#263f39"/></linearGradient>
    <linearGradient id="port" x1="0" y1="560" x2="290" y2="840" gradientUnits="userSpaceOnUse"><stop stop-color="#3d4844"/><stop offset="1" stop-color="#252f30"/></linearGradient>
    <linearGradient id="sheen" x1="340" y1="560" x2="545" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#8f713e" stop-opacity=".12"/><stop offset=".3" stop-color="#4d6c73" stop-opacity=".24"/><stop offset=".7" stop-color="#726246" stop-opacity=".08"/><stop offset="1" stop-color="#182c33" stop-opacity="0"/></linearGradient>
    <radialGradient id="vignette"><stop offset=".4" stop-color="#06131a" stop-opacity="0"/><stop offset="1" stop-color="#06131a" stop-opacity=".48"/></radialGradient>
    <pattern id="grid" width="120" height="120" patternUnits="userSpaceOnUse"><path d="M120 0H0V120" stroke="#8ca5a4" stroke-width=".6" opacity=".13"/><path d="M60 0V120M0 60H120" stroke="#8ca5a4" stroke-width=".4" opacity=".04"/></pattern>
    <pattern id="marsh" width="29" height="26" patternUnits="userSpaceOnUse"><path d="M3 19l2-7 2 7M19 8l2-5 2 5M15 26l1-4 2 4" stroke="#9ba083" stroke-width=".8" opacity=".25"/><path d="M7 20h6M19 10h4" stroke="#162d27" stroke-width="1" opacity=".45"/></pattern>
    <pattern id="water" width="84" height="56" patternUnits="userSpaceOnUse"><path d="M3 21c7-3 11-3 18-2m27 18c6-3 14-2 21-5M25 49l12-3m31-36 8-2" stroke="#8baba7" stroke-width=".5" opacity=".045"/></pattern>
    <pattern id="yard" width="17" height="17" patternUnits="userSpaceOnUse"><path d="M0 0H17V17" stroke="#b1b7a7" stroke-width=".6" opacity=".09"/></pattern>
